name: Security Scanning

# A auditoria precisa rodar em todo PR, mesmo quando os arquivos alterados não
# acionam o pipeline mais amplo de build e testes definido em vectora.yml.
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [master, "release/**"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.13"

jobs:
  pr_maintenance:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    uses: ./.github/workflows/pr-maintenance-check.yml
    with:
      workflow_name: ${{ github.workflow }}

  security:
    name: Security Scanning
    needs: pr_maintenance
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      needs.pr_maintenance.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bandit (static security analysis)
        run: uv run bandit -c pyproject.toml -r backend -f json -o bandit.json
      - name: pip-audit (vulnerable dependencies)
        if: ${{ !cancelled() }}
        run: uv run --with pip-audit pip-audit --skip-editable --format json --output pip-audit.json
      - name: Upload security reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: python-security-${{ github.sha }}
          path: |
            bandit.json
            pip-audit.json
          if-no-files-found: error
