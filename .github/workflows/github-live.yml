name: GitHub live access contracts

on:
  push:
    branches: [master, "release/**"]
    paths:
      - "backend/tools/**"
      - "tests/unit/test_tools_github_live.py"
      - "tests/integration/test_workbench_live_dispatch.py"
      - ".github/workflows/github-live.yml"
      - ".github/actions/setup-uv/**"
  pull_request:
    branches: [master, "release/**"]
    paths:
      - "backend/tools/**"
      - "tests/unit/test_tools_github_live.py"
      - "tests/integration/test_workbench_live_dispatch.py"
      - ".github/workflows/github-live.yml"
      - ".github/actions/setup-uv/**"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: .
env:
  PYTHON_VERSION: "3.13"

jobs:
  pr_maintenance:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    uses: ./.github/workflows/pr-maintenance-check.yml
    with:
      workflow_name: ${{ github.workflow }}

  public:
    name: Public GitHub access without token
    needs: pr_maintenance
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      needs.pr_maintenance.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Exercise public REST and web routes
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: >-
          uv run pytest tests/unit/test_tools_github_live.py -m live
          -k "publico or repos_publicos" -v --timeout=120

  authenticated:
    name: Authenticated GitHub access with native token
    needs: pr_maintenance
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      needs.pr_maintenance.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Exercise REST, web and gh CLI routes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest tests/unit/test_tools_github_live.py -m live
          -k "com_token_real or cli_pr_view" -v --timeout=120

  native-dispatch:
    name: Native agent Workbench dispatch contracts
    needs: pr_maintenance
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      needs.pr_maintenance.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Exercise real GitHub HTTP, web fetch and shell via ToolSpec
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: >-
          uv run pytest tests/integration/test_workbench_live_dispatch.py
          -m live -k "not authenticated" -v --timeout=180

  native-dispatch-authenticated:
    name: Native agent authenticated Workbench dispatch
    needs: pr_maintenance
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.action != 'synchronize' ||
      needs.pr_maintenance.outputs.run_checks != 'false')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Exercise native GitHub dispatch with workflow token
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run pytest tests/integration/test_workbench_live_dispatch.py
          -m live -k authenticated -v --timeout=180
